name: publish

# Polls three times an hour and publishes on the first poll inside a window that
# has not been used today. The windows live in config.json (08:30-12:30,
# 15:00-18:45 and 19:30-22:45 IST).
#
# It used to be two crons aimed at 08:40 and 19:40. That does not work: GitHub
# runs scheduled workflows best-effort, queues them under load and drops them
# outright when it is heavy.
#
# The polling rewrite assumed the cron would at least mostly be delivered. It is
# not. Measured on 2026-09-18: `*/20` landed on main at 12:58, was due ~16 times
# by 18:19, and ran ONCE — at 17:51, between two windows, so it correctly did
# nothing while a post sat in the queue and the 15:00-17:00 window passed unused.
#
# Two changes came out of that. The windows in config.json now run for hours
# rather than two, because a window only catches a poll if it is wide. And the
# minutes here avoid :00, :20 and :40 — GitHub's own docs say scheduled runs are
# delayed most at the start of the hour, and `*/20` aimed a third of its
# attempts straight at the worst minute of the hour for no reason.
#
# Public repos get unlimited Actions minutes, so polling is free either way, and
# all but a few polls stop at the `due` step before any API call or mailbox read.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      now:
        description: "Publish immediately, ignoring the windows"
        type: boolean
        default: false

permissions:
  contents: write

# Shared with generate and approve: posts.db is binary, so only one workflow
# may be writing it at a time.
concurrency:
  group: state
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # publish.py is stdlib-only, so there is no install step to fail

      # Cheap on purpose: config and the local database, no network at all.
      # This is what makes polling 72 times a day reasonable.
      - name: Is a slot open?
        id: due
        run: |
          if [ "${{ inputs.now }}" = "true" ]; then
            echo "forced by hand"
            echo "go=yes" >> "$GITHUB_OUTPUT"
          elif python3 publish.py due; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi

      # Between the gate and the post, because the paths that matter here only
      # run while a post is half-created: a NameError inside wait_for_container
      # shipped once and was only found against a live container. stdlib only,
      # 3ms, and only on the two polls a day that are about to do something.
      - name: Tests
        if: steps.due.outputs.go == 'yes'
        run: python3 tests.py

      - name: Pre-flight
        if: steps.due.outputs.go == 'yes'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 publish.py check

      - name: Publish next queued post
        if: steps.due.outputs.go == 'yes'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_EMAIL_PASSWORD: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
        run: python3 publish.py next ${{ inputs.now == true && '--now' || '' }}

      - name: Collect insights
        if: steps.due.outputs.go == 'yes'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 publish.py insights || true

      # The commit is the persistence layer AND the keepalive: GitHub disables a
      # scheduled workflow after 60 days with no commit on the default branch.
      # Only the polls that did something reach it, which is enough — two a day.
      - name: Commit state
        if: steps.due.outputs.go == 'yes'
        run: |
          tools/commit_state.sh "state: $(date -u +%Y-%m-%dT%H:%MZ)" posts.db
