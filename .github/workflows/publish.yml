name: publish

# 08:40 and 19:40 IST. Deliberately off the hour: GitHub runs scheduled
# workflows best-effort and queues them under load, which peaks at :00.
on:
  # PARKED until the first manual publish succeeds. Uncomment the two cron lines
  # to go live; they fire at 08:40 and 19:40 IST. Deliberately off the hour:
  # GitHub queues scheduled runs under load, and load peaks at :00.
  # schedule:
  #   - cron: "10 3 * * *"
  #   - cron: "10 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # publish.py is stdlib-only, so there is no install step to fail

      - name: Pre-flight
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 publish.py check

      - name: Publish next queued post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_EMAIL_PASSWORD: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
        run: python3 publish.py next

      - name: Collect insights
        if: always()
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 publish.py insights || true

      # The commit is the persistence layer AND the keepalive: GitHub disables a
      # scheduled workflow after 60 days with no commit on the default branch.
      - name: Commit state
        if: always()
        run: |
          git config user.name  "30unfortunately-bot"
          git config user.email "rajat5ranjan@users.noreply.github.com"
          git add posts.db
          git diff --staged --quiet || git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
