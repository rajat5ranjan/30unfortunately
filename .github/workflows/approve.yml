name: approve

# The manual override, not the normal path — generate.yml approves the top
# candidates by itself and the veto arrives by email. This is for pushing a
# specific candidate out of order: Actions -> approve -> Run workflow -> type
# the candidate number from the job summary.
on:
  workflow_dispatch:
    inputs:
      pick:
        description: "Candidate number from the latest generate run"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: state

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q google-genai PyYAML Pillow av

      # No preflight here: the slides are not on Pages until the commit below
      # lands and Pages rebuilds. publish.py checks liveness at publish time.
      - name: Approve, render and queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 brain.py --approve "${{ inputs.pick }}"
          ID=$(ls -t content/approved/*.json | head -1 | xargs basename | sed 's/.json//')
          echo "approved $ID" >> "$GITHUB_STEP_SUMMARY"
          python3 render.py --from "content/approved/$ID.json"
          python3 reel.py --from "content/approved/$ID.json"
          python3 tools/release_upload.py "build/reels/$ID.mp4" "build/reels/$ID-cover.jpg"
          python3 publish.py queue --src "content/approved/$ID.json"

      # The queue and the rendered slides both live in the repo, so this commit
      # is what hands the post to the publish job. Pages needs a minute or two
      # afterwards before Meta can fetch the images.
      - name: Commit
        run: |
          tools/commit_state.sh "approve: queue next post" content/approved docs posts.db
