name: generate

# 06:15 IST. Generation is backlog-driven, and the numbers have to work or the
# gate never trips:
#
#   publish consumes 2/day. If a run approves 2, the queue is empty again every
#   morning, min-backlog is always satisfied, and Gemini is called daily — the
#   opposite of the intent.
#
#   Approving 6 per run instead:
#     day 1  0 -> generate -> 6   publish 2 -> 4
#     day 2  4 -> skip            publish 2 -> 2
#     day 3  2 -> generate -> 8   publish 2 -> 6
#     day 4  6 -> skip            publish 2 -> 4
#
#   so roughly one call every two or three days, and a 2-6 post cushion if
#   Gemini is down. posts_per_trend is 3 (config.json) so a run yields ~10-12
#   candidates and the top 6 is still the better half, not the whole batch.
on:
  schedule:
    - cron: "45 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Generate even if the backlog is healthy"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: generate

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q google-genai PyYAML Pillow

      - name: Pull trends
        run: python3 trend_agent.py

      - name: Generate, rank, auto-approve the best six
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          BACKLOG="--min-backlog ${{ inputs.force && '0' || '4' }}"
          python3 brain.py $BACKLOG --auto 6 | tee /tmp/gen.log

      - name: Render and queue whatever was approved
        run: |
          set -euo pipefail
          NEW=$(git ls-files --others --exclude-standard content/approved || true)
          if [ -z "$NEW" ]; then echo "nothing new approved"; exit 0; fi
          for f in $NEW; do
            python3 render.py --from "$f"
            python3 publish.py queue --src "$f"
          done
          python3 brain.py --summary >> "$GITHUB_STEP_SUMMARY"
          python3 brain.py --html

      - name: Commit
        run: |
          git config user.name  "30unfortunately-bot"
          git config user.email "rajat5ranjan@users.noreply.github.com"
          git add content docs posts.db
          git diff --staged --quiet || git commit -m "queue: $(date -u +%Y-%m-%d)"
          git push

      # The veto window: you are notified, you do nothing, it ships. Reply
      # "skip g005" to that email and publish.py drops it seconds before posting.
      - name: Email the queue
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_EMAIL_PASSWORD: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: |
          set -euo pipefail
          QUEUE=$(python3 publish.py list)
          [ "$QUEUE" = "queue is empty" ] && exit 0
          python3 notify.py send "30unfortunately — queued $(date -u +%Y-%m-%d)" \
            "$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
              "These go live at the next slots unless you stop them." \
              "$QUEUE" \
              "To stop one, just reply to this email with: skip g005" \
              "Full text: https://rajat5ranjan.github.io/30unfortunately/candidates.html")"
